<!doctype html>
<html lang="es">
<head>
<title>ADECOM</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────────── */
:root{
  --bg:#f9fafb;--sf:#ffffff;--sf2:#f3f4f6;
  --bd:#e5e7eb;--bd2:#d1d5db;
  --tx1:#1d2739;--tx2:#667085;--tx3:#98a2b3;
  --ac:#465fff;--ac10:#eef0ff;
  --ok:#039855;--ok10:#d1fadf;
  --wa:#dc6803;--wa10:#fef0c7;
  --er:#d92d20;--er10:#fee4e2;
  --sw:260px;--hh:60px;--r:16px;--rsm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--tx1);font-size:14px;line-height:1.5;min-height:100vh}
button{cursor:pointer;font-family:inherit;background:none;border:none;color:inherit}
input,select{font-family:inherit;font-size:inherit}
svg{display:block}

/* ── LAYOUT ──────────────────────────────────────────────────── */
.layout{display:flex;min-height:100vh}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar{
  width:var(--sw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);
  position:fixed;top:0;left:0;height:100vh;
  display:flex;flex-direction:column;overflow-y:auto;z-index:50;
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.sb-logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid var(--bd);flex-shrink:0}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
.logo-name{font-weight:700;font-size:15px;letter-spacing:-.025em;line-height:1.2}
.logo-sub{font-size:11px;color:var(--tx2);margin-top:1px}
.sb-nav{padding:10px 10px 6px;flex:1;display:flex;flex-direction:column;gap:1px}
.sb-grp{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:14px 8px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rsm);font-size:13px;font-weight:500;color:var(--tx2);transition:background .1s,color .1s;width:100%;text-align:left}
.nav-item svg{flex-shrink:0;opacity:.5;transition:opacity .1s}
.nav-item:hover{background:var(--sf2);color:var(--tx1)}
.nav-item:hover svg{opacity:.8}
.nav-item.active{background:var(--ac10);color:var(--ac);font-weight:600}
.nav-item.active svg{opacity:1;color:var(--ac)}
.sb-footer{padding:14px 18px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--ac10);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;line-height:1.3}
.user-role{font-size:11px;color:var(--tx2)}

/* ── MAIN ────────────────────────────────────────────────────── */
.main{margin-left:var(--sw);flex:1;min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:40;height:var(--hh);background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 24px}
/* hamburger: sólo CSS controla visibilidad */
.hd-menu{display:none;width:36px;height:36px;border-radius:var(--rsm);background:var(--sf2);color:var(--tx2);align-items:center;justify-content:center;transition:background .1s}
.hd-menu:hover{background:var(--bd)}
.hd-title{font-size:16px;font-weight:700;letter-spacing:-.025em}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hd-pill{display:inline-flex;align-items:center;gap:5px;background:var(--ok10);color:var(--ok);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
.hd-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.hd-ts{font-size:12px;color:var(--tx2)}

/* ── CONTENT ─────────────────────────────────────────────────── */
.content{padding:22px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.sec{display:none}
.sec.on{display:flex;flex-direction:column;gap:18px}

/* ── KPI GRID ────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .1s}
.kpi:hover{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac10)}
.kpi:active{transform:scale(.98)}
.kpi-ico{width:48px;height:48px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tx2)}
.kpi-ico.c-ac{background:var(--ac10);color:var(--ac)}
.kpi-ico.c-ok{background:var(--ok10);color:var(--ok)}
.kpi-ico.c-wa{background:var(--wa10);color:var(--wa)}
.kpi-ico.c-er{background:var(--er10);color:var(--er)}
.kpi-val{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:12px;font-weight:500;color:var(--tx2);margin-top:4px}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin-top:6px;padding:3px 8px;border-radius:20px}
.d-up{background:var(--ok10);color:var(--ok)}
.d-dn{background:var(--er10);color:var(--er)}
.d-nu{background:var(--sf2);color:var(--tx3)}

/* ── CHART ROW ───────────────────────────────────────────────── */
.chart-row{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.card-ttl{font-size:14px;font-weight:700;letter-spacing:-.02em}
.card-sub{font-size:12px;color:var(--tx2);margin-top:2px;margin-bottom:16px}
.chart-scroll{overflow-x:auto}
.bc-bar{fill:var(--bd2)}
.bc-bar-active{fill:var(--ac)}
.bc-label{font-size:11px;fill:var(--tx3);font-family:'Outfit',sans-serif}
.bc-val{font-size:11px;font-family:'Outfit',sans-serif;font-weight:700}
.hb-bar{fill:var(--ac);opacity:.8}
.hb-lbl{font-size:11px;fill:var(--tx2);font-family:'Outfit',sans-serif}
.hb-val{font-size:11px;font-family:'Outfit',sans-serif;font-weight:600;fill:var(--tx2)}

/* ── TABLE CARD ──────────────────────────────────────────────── */
.tbl-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tbl-head{display:flex;align-items:center;gap:12px;padding:16px 20px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--sf2);color:var(--tx3);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:9px 16px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th.th-sort:hover{color:var(--ac);background:var(--ac10)}
.sort-ic{font-size:11px;margin-left:3px;color:var(--ac)}
th.r,td.r{text-align:right}
tbody tr{border-top:1px solid var(--bd);transition:background .08s;cursor:pointer}
tbody tr:hover{background:var(--ac10)}
tbody tr.no-click{cursor:default}
tbody tr.no-click:hover{background:transparent}
tbody td{padding:9px 16px;white-space:nowrap;vertical-align:middle}
.td-num{font-variant-numeric:tabular-nums;font-weight:600}
.td-dim{color:var(--tx2);font-size:12px}
.td-code{font-family:ui-monospace,monospace;font-size:12px;color:var(--tx2)}
.tbl-foot{font-size:11px;color:var(--tx3);padding:9px 16px;border-top:1px solid var(--bd)}

/* ── BADGES ──────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.b44{background:var(--ac10);color:var(--ac)}
.b43{background:var(--ok10);color:var(--ok)}
.b42{background:var(--wa10);color:var(--wa)}
.b41,.b40{background:var(--sf2);color:var(--tx2)}
.b-fab{background:var(--ac10);color:var(--ac)}
.b-bol{background:var(--ok10);color:var(--ok)}
.b-nc{background:var(--er10);color:var(--er)}
.b-otro{background:var(--sf2);color:var(--tx2)}
.pbar{height:6px;background:var(--bd);border-radius:3px}
.pbar-fill{height:100%;border-radius:3px;background:var(--ac)}

/* ── FILTER BAR ──────────────────────────────────────────────── */
.fbar{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.flbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.segs{display:flex;gap:3px;background:var(--sf2);border-radius:7px;padding:3px}
.seg{padding:4px 12px;border-radius:5px;font-size:12px;font-weight:600;color:var(--tx2);transition:background .1s,color .1s;white-space:nowrap}
.seg:hover{background:var(--bd);color:var(--tx1)}
.seg.on{background:var(--ac);color:#fff}
.finput{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx1);padding:5px 10px;outline:none;transition:border-color .1s}
.finput:focus{border-color:var(--ac)}

/* ── TEMP GRID ───────────────────────────────────────────────── */
.temp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.temp-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.temp-card:hover,.temp-card.sel{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac10)}
.temp-badge-lg{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;font-size:14px;font-weight:800;margin-bottom:10px}
.temp-total{font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.temp-label{font-size:11px;color:var(--tx2);margin-top:3px}
.temp-mods{font-size:11px;color:var(--tx3);margin-top:2px}

/* ── PLACEHOLDER ─────────────────────────────────────────────── */
.ph{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:52px 24px;text-align:center;color:var(--tx2)}
.ph svg{margin:0 auto 14px;color:var(--tx3)}
.ph h3{font-size:15px;font-weight:700;color:var(--tx1);margin-bottom:7px}
.ph p{font-size:13px;max-width:360px;margin:0 auto;line-height:1.7}

/* ── OVERLAY ─────────────────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49}

/* ── MOBILE ──────────────────────────────────────────────────── */
@media(max-width:1100px){
  .hd-menu{display:flex}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}
  .main{margin-left:0}
}
@media(max-width:960px){
  .chart-row{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .temp-grid{grid-template-columns:repeat(4,1fr)}
  .content{padding:14px;gap:14px}
  .header{padding:0 14px}
}
@media(max-width:700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .temp-grid{grid-template-columns:repeat(3,1fr)}
  .content{padding:12px;gap:12px}
  .header{padding:0 12px}
  .hd-ts{font-size:11px}
  .segs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .segs::-webkit-scrollbar{display:none}
  .fbar{gap:8px;padding:10px 12px}
  .tbl-scroll{-webkit-overflow-scrolling:touch}
  thead th{padding:7px 10px;font-size:9px}
  tbody td{padding:7px 10px;font-size:12px}
  .tbl-foot{padding:7px 12px}
  .kpi{padding:14px 16px}
  .card{padding:16px}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .temp-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-val{font-size:20px}
  .kpi-ico{width:40px;height:40px}
  .hd-ts{display:none}
  .seg{padding:4px 9px;font-size:11px}
  .content{padding:10px;gap:10px}
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="layout">

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">
    <div class="logo-mark">A</div>
    <div><div class="logo-name">ADECOM</div><div class="logo-sub">Mohicano Jeans</div></div>
  </div>
  <nav class="sb-nav">

    <div class="sb-grp">Inicio</div>
    <button class="nav-item active" data-sec="resumen" data-ttl="Resumen General">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Resumen
    </button>

    <div class="sb-grp">Pedidos</div>

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg>
      Top 10 Pedidos
    </button>
    <button class="nav-item" data-sec="pvc" data-ttl="Pedido vs Corte">

    </button>

    <div class="sb-grp">Producción</div>
    <button class="nav-item" data-sec="stock" data-ttl="Stock Bodega">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Stock Bodega
    </button>
    <button class="nav-item" data-sec="tabla" data-ttl="Tabla Completa">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      Tabla Completa
    </button>

    <div class="sb-grp">Venta</div>
    <button class="nav-item" data-sec="reporte-venta" data-ttl="Reporte Venta">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Reporte Venta
    </button>
    <button class="nav-item" data-sec="venta-despacho" data-ttl="Venta vs Despacho">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Venta vs Despacho
    </button>
    <button class="nav-item" data-sec="clientes" data-ttl="Clientes Inactivos">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes Inactivos
    </button>

    <div class="sb-grp">Finanzas</div>
    <button class="nav-item" data-sec="er" data-ttl="Estado de Resultado">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>

  </nav>
  <div class="sb-footer">
    <div class="user-av">M</div>
    <div><div class="user-name">Manu</div><div class="user-role">Datos y Reportes</div></div>
  </div>
</aside>

<!-- ── MAIN ── -->
<div class="main">
  <header class="header">
    <button class="hd-menu" id="hamburger" aria-label="Menú">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="hd-title" id="hdTitle">Resumen General</span>
    <div class="hd-right">
      <div class="hd-pill"><div class="hd-dot"></div>T44 activa</div>
      <span class="hd-ts" id="hdTs">—</span>
    </div>
  </header>
  <div class="content" id="content">
    <div style="padding:60px;text-align:center;color:var(--tx2)">Cargando…</div>
  </div>
</div>
</div>

<script>
/* ── CACHE ──────────────────────────────────────────────────── */
const CACHE = {};
async function load(file) {
  if (!CACHE[file]) {
    try { CACHE[file] = await (await fetch(file)).json(); }
    catch { CACHE[file] = []; }
  }
  return CACHE[file];
}

/* ── UTILS ──────────────────────────────────────────────────── */
const fmt     = n => Math.round(n).toLocaleString('es-CL');
const fmtCLP  = n => '$' + fmt(n);
const fmtM    = n => n >= 1e6 ? '$'+(n/1e6).toFixed(2)+'M' : n >= 1e3 ? '$'+(n/1e3).toFixed(0)+'k' : fmtCLP(n);
const today   = () => new Date().toISOString().split('T')[0];

function deltaInfo(cur, prev) {
  if (!prev) return { html:'—', cls:'d-nu' };
  const p = ((cur - prev) / prev * 100);
  const arr = p >= 0
    ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>'
    : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>';
  return { html:`${arr} ${Math.abs(p).toFixed(1)}%`, cls: p >= 0 ? 'd-up' : 'd-dn' };
}

function tipoBadge(tipo) {
  if (!tipo) return '';
  const t = tipo.toString().trim();
  if (t.includes('33') || t.toLowerCase().includes('elec') || t.toLowerCase().includes('fac'))
    return `<span class="badge b-fab">FAC</span>`;
  if (t.includes('39') || t.toLowerCase().includes('bol'))
    return `<span class="badge b-bol">BOL</span>`;
  if (t.includes('61') || t.toLowerCase().includes('nc') || t.toLowerCase().includes('cred'))
    return `<span class="badge b-nc">NC</span>`;
  return `<span class="badge b-otro">${t.slice(0,6)}</span>`;
}

/* ── LOADED DATA ────────────────────────────────────────────── */
let PEDS_ART  = [];   // pedidos_art.json
let DOCS      = [];   // docs_venta.json
let VENTA_HOY = null;

const TC = {
  '44':{cls:'b44',bg:'var(--ac10)',fg:'var(--ac)'},
  '43':{cls:'b43',bg:'var(--ok10)',fg:'var(--ok)'},
  '42':{cls:'b42',bg:'var(--wa10)',fg:'var(--wa)'},
  '41':{cls:'b41',bg:'var(--sf2)',fg:'var(--tx2)'},
  '40':{cls:'b40',bg:'var(--sf2)',fg:'var(--tx3)'},
  '39':{cls:'b39',bg:'#f3e8ff',fg:'#7c3aed'},
  '38':{cls:'b38',bg:'#fce7f3',fg:'#be185d'},
  '45':{cls:'b45',bg:'#ecfdf5',fg:'#065f46'},
};
function tcFor(t) { return TC[t] || {cls:'b40',bg:'var(--sf2)',fg:'var(--tx3)'}; }

/* ── COMPUTE PEDIDOS ART ────────────────────────────────────── */
function buildByTemp() {
  const byTemp = {};
  for (const item of PEDS_ART) {
    const t = item.temp;
    if (!byTemp[t]) byTemp[t] = { total:0, modelos:0, items:[] };
    byTemp[t].total += item.total;
    byTemp[t].modelos++;
    byTemp[t].items.push({ base:item.base, total:item.total, colores:item.modelos.length, modelos:item.modelos });
  }
  return byTemp;
}

/* ── SVG BAR CHART ──────────────────────────────────────────── */
function barChart(byTemp) {
  const keys = ['40','41','42','43','44'].filter(t => byTemp[t]);
  const vals = keys.map(t => byTemp[t].total);
  const maxV = Math.max(...vals);
  const bW=56, gap=20, pH=175, padL=0, padB=28, valH=18;
  const W = keys.length * (bW + gap) - gap + 10;
  const areaH = pH - padB - valH;
  let s = `<svg viewBox="0 0 ${W} ${pH}" style="width:100%;min-width:${Math.min(W,280)}px;height:${pH}px;overflow:visible">`;
  keys.forEach((t, i) => {
    const v = vals[i];
    const bH = Math.max(6, Math.round((v / maxV) * areaH));
    const x = i * (bW + gap);
    const y = pH - padB - bH;
    const ac = t === '44';
    s += `<g style="cursor:pointer" data-bar-temp="${t}">
      <rect class="${ac?'bc-bar-active':'bc-bar'}" x="${x}" y="${y}" width="${bW}" height="${bH}" rx="6"/>
      <rect x="${x}" y="${y}" width="${bW}" height="${bH}" rx="6" fill="transparent"/>
      <text class="bc-label" x="${x+bW/2}" y="${pH-8}" text-anchor="middle">T${t}</text>
      <text class="bc-val" x="${x+bW/2}" y="${y-5}" text-anchor="middle" fill="${ac?'var(--ac)':'var(--tx2)'}">${(v/1000).toFixed(1)}k</text>
    </g>`;
  });
  return s + '</svg>';
}

/* ── SVG HORIZ BARS ─────────────────────────────────────────── */
function horizBars(items) {
  const max = items[0]?.total || 1;
  const rH=26, pT=4, lW=44, bMW=180, nW=55;
  const H = items.length * rH + pT * 2;
  const W = lW + bMW + nW;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">`;
  items.forEach((item, i) => {
    const y = pT + i * rH;
    const bw = Math.max(4, Math.round((item.total / max) * bMW));
    s += `<g style="cursor:pointer" data-bar-base="${item.base}">
      <rect x="0" y="${y}" width="${W}" height="${rH}" fill="transparent"/>
      <text class="hb-lbl" x="${lW-6}" y="${y+16}" text-anchor="end">${item.base}</text>
      <rect class="hb-bar" x="${lW}" y="${y+7}" width="${bw}" height="14" rx="3"/>
      <text class="hb-val" x="${lW+bw+6}" y="${y+17}">${fmt(item.total)}</text>
    </g>`;
  });
  return s + '</svg>';
}

/* ── TABLA COMPLETA ─────────────────────────────────────────── */
function getEtapa(r) {
  const saldo = r.saldo || 0;
  // saldo=0 y tiene entrega → todo entregado a bodega
  if (saldo <= 0 && (r.bodega||0) > 0) return 'Bodega';
  // Hay saldo pendiente: buscar la última etapa alcanzada (más avanzada primero)
  if ((r.terminacion||0) > 0) return 'Terminación';
  if ((r.lavanderia||0)  > 0) return 'Lavandería';
  if ((r.taller||0)      > 0) return 'Costura';
  if ((r.texterno||0)    > 0) return 'T.Externo';
  if ((r.limpiado||0)    > 0) return 'Limpiado';
  if ((r.proceso||0)     > 0) return 'Corte';
  return 'Sin movimiento';
}

function getHoyDocs() {
  const hoy = today();
  const docs = DOCS.filter(r => r.fecha_iso === hoy);
  if (docs.length > 0) return { docs, label: 'Documentos de Hoy', date: null, fallback: false };
  const dates = [...new Set(DOCS.map(r => r.fecha_iso).filter(Boolean))].sort();
  if (!dates.length) return { docs: [], label: 'Sin documentos', date: null, fallback: false };
  const last = dates[dates.length - 1];
  const [yr, mo, dy] = last.split('-');
  return { docs: DOCS.filter(r => r.fecha_iso === last), label: `Documentos del ${dy}/${mo}/${yr}`, date: last, fallback: true };
}

function buildFtMap(ft) {
  const m = {};
  for (const r of ft) {
    const a = (r.articulo||'').trim();
    if (!m[a]) m[a] = { corte:0, bodega:0, etapas:{}, ocs:[] };
    m[a].corte  += r.proceso||0;
    m[a].bodega += r.bodega||0;
    const et = getEtapa(r);
    // Guardar cada OC individual para mostrar en filas expandibles
    m[a].ocs.push({ unidades: r.proceso||0, saldo: r.saldo||0, etapa: et });
    if (et !== 'Bodega' && et !== 'Sin movimiento') {
      m[a].etapas[et] = (m[a].etapas[et]||0) + 1;
    }
  }
  for (const a in m) {
    const entries = Object.entries(m[a].etapas)
      .sort((x,y) => (ETAPA_RANK[y[0]]??-2) - (ETAPA_RANK[x[0]]??-2));
    m[a].etapa = entries.length ? entries[0][0] : 'Sin movimiento';
  }
  return m;
}

function buildPVCRows(t, ftMap, exMap) {
  const byTemp = buildByTemp();
  const rawItems = byTemp[t]?.items || [];
  const tc = tcFor(t);
  if (!rawItems.length) return '<tr class="no-click"><td colspan="10" style="text-align:center;padding:20px;color:var(--tx3)">Sin datos de pedidos para T'+t+'</td></tr>';

  // Pre-calcular corteTotal y diff para ordenar por Diferencia desc
  const items = rawItems.map(item => {
    const suffix = item.base.slice(-2);
    let ct = 0;
    for (const v of (item.modelos||[])) {
      const art = `01${t}${suffix}${v.mod.padStart(2,'0')}`;
      ct += ftMap[art]?.corte || 0;
    }
    return { ...item, _ct: ct, _diff: ct - item.total };
  }).sort((a, b) => {
    if (a._diff >= 0 && b._diff >= 0) return b._diff - a._diff;   // ambos positivos: mayor primero
    if (a._diff < 0  && b._diff < 0)  return a._diff - b._diff;   // ambos negativos: más negativo primero
    return b._diff >= 0 ? 1 : -1;                                  // positivos antes que negativos
  });

  return items.map(item => {
    const suffix = item.base.slice(-2);
    let corteTotal = 0;
    const modelEtapas = {};
    const allOcs = [];
    for (const v of (item.modelos || [])) {
      const art = `01${t}${suffix}${v.mod.padStart(2,'0')}`;
      const ftr = ftMap[art] || {};
      corteTotal += ftr.corte || 0;
      const artEtapas = Object.entries(ftr.etapas || {})
        .sort((x,y) => (ETAPA_RANK[y[0]]??-2) - (ETAPA_RANK[x[0]]??-2));
      for (const [e] of artEtapas) modelEtapas[e] = (modelEtapas[e]||0) + 1;
      for (const oc of (ftr.ocs || [])) allOcs.push(oc);
    }
    const ocRows = allOcs.map((oc, idx) => {
      const etClr = etapaClr(oc.etapa);
      return `<tr class="no-click variant-row" style="display:none;background:var(--sf2)">
        <td></td>
        <td class="td-dim" style="padding-left:28px">└ corte ${idx+1}</td>
        <td></td>
        <td class="r td-dim">${oc.unidades ? fmt(oc.unidades) : '—'}</td>
        <td></td>
        <td class="r td-dim" style="color:${oc.saldo>0?'var(--wa)':'var(--tx3)'};">${oc.saldo ? fmt(oc.saldo)+' u.' : '—'}</td>
        <td></td><td></td><td></td>
        <td style="padding-left:6px"><span style="color:${etClr};font-size:10px;font-weight:600">${oc.etapa}</span></td>
      </tr>`;
    }).join('');
    const diff = corteTotal - item.total;
    const pct  = item.total ? (corteTotal / item.total * 100).toFixed(0) : 0;
    const cls  = diff > 0 ? 'var(--ok)' : diff < 0 ? 'var(--er)' : 'var(--tx3)';
    const estadoKey = diff > 0 ? 'ofrecer' : diff < 0 ? 'cortar' : 'ok';
    // ESTADO
    const estadoHtml = diff > 0
      ? `<span style="background:var(--ok10);color:var(--ok);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap">▲ Ofrecer</span>`
      : diff < 0
        ? `<span style="background:var(--er10);color:var(--er);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap">▼ Cortar más</span>`
        : `<span style="background:var(--sf2);color:var(--tx3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap">✓ OK</span>`;
    // EX
    const ex = exMap ? exMap[item.base] : null;
    const exHtml = ex?.ex_base
      ? `<span style="background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${ex.ex_base}</span>`
      : `<span style="color:var(--tx3);font-size:11px">—</span>`;
    const cantExHtml = ex?.ex_saldo > 0
      ? `<span style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${fmt(ex.ex_saldo)}</span>`
      : `<span style="color:var(--bd2);font-size:12px">————</span>`;
    // Etapa summary for model — ordenar por rango (etapa más avanzada primero)
    const etapaEntries = Object.entries(modelEtapas)
      .sort((a,b) => (ETAPA_RANK[b[0]]??-2) - (ETAPA_RANK[a[0]]??-2));
    const modelEtapaHtml = etapaEntries.length
      ? etapaEntries.slice(0,2).map(([e]) =>
          `<span style="display:inline-block;background:${etapaClr(e)}20;color:${etapaClr(e)};border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;margin-right:2px;white-space:nowrap">${e}</span>`
        ).join('')
      : '<span style="color:var(--tx3);font-size:11px">—</span>';
    const domEtapa = etapaEntries.length ? etapaEntries[0][0] : '—';
    return `<tr data-expandable data-estado="${estadoKey}" data-etapa="${domEtapa}" data-ped="${item.total}" data-cort="${corteTotal}" data-ocs="${allOcs.length}" style="font-weight:600">
      <td><span class="badge ${tc.cls}">T${t}</span> <span class="td-code" style="margin-left:6px">${item.base}</span></td>
      <td class="td-dim" style="font-weight:400">${allOcs.length} corte${allOcs.length>1?'s':''}</td>
      <td class="r td-num">${fmt(item.total)}</td>
      <td class="r td-num">${corteTotal ? fmt(corteTotal) : '—'}</td>
      <td class="r td-dim">${corteTotal ? `${pct}%` : '—'}</td>
      <td class="r td-num" style="color:${cls}">${diff > 0 ? '+' : ''}${diff ? fmt(diff) : '—'}</td>
      <td style="text-align:center">${estadoHtml}</td>
      <td>${exHtml}</td>
      <td class="r">${cantExHtml}</td>
      <td style="padding-left:4px">${modelEtapaHtml}</td>
    </tr>${ocRows}`;
  }).join('');
}

async function go(secId, title) {
  document.getElementById('hdTitle').textContent = title;
  document.getElementById('content').innerHTML = '<div style="padding:40px;text-align:center;color:var(--tx2)">Cargando…</div>';
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.sec === secId));

/* ── BIND EVENTS ────────────────────────────────────────────── */
function bindContent(secId) {
  // [data-goto] → navegar
  document.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => go(el.dataset.goto, el.dataset.gotoTtl));
  });

  // SVG bar chart → ir a detalle-color
  document.querySelectorAll('[data-bar-temp]').forEach(el => {
    el.addEventListener('click', () => go('detalle-color', 'Detalle Pedido Color'));
  });

  // Horiz bars → ir a detalle-color
  document.querySelectorAll('[data-bar-base]').forEach(el => {
    el.addEventListener('click', () => go('detalle-color', 'Detalle Pedido Color'));
  });

  // Detalle color section
  if (secId === 'detalle-color') {
    const byTemp = buildByTemp();
    const temps = ['44','43','42','41','40'].filter(t => byTemp[t]);

    document.querySelectorAll('#dcSegs .seg').forEach(btn => {

        document.getElementById('dcBody').innerHTML = buildColorRowsForTemp(byTemp, t);

          c.classList.toggle('sel', c.dataset.tempCard === t));
        bindExpandRows();
      });
    });

    document.querySelectorAll('[data-temp-card]').forEach(card => {
      card.addEventListener('click', () => {
        const t = card.dataset.tempCard;
        const btn = document.querySelector(`#dcSegs .seg[data-t="${t}"]`);
        if (btn) btn.click();
      });
    });

    bindExpandRows();
  }

  // Tabla Completa section — client-side filters
  if (secId === 'tabla') {
    const allRows = () => Array.from(document.querySelectorAll('#tablaBody tr[data-art]'));
    function applyTablaFilters() {
      const etapa = document.getElementById('tblEtapa')?.value || 'todo';
      const temp  = document.querySelector('#tblTempSegs .seg.on')?.dataset.t || 'todo';
      const tipo  = document.querySelector('#tblTipoSegs .seg.on')?.dataset.tp || 'todo';
      const art   = (document.getElementById('tblArtSearch')?.value||'').trim().toLowerCase();
      const oc    = (document.getElementById('tblOcSearch')?.value||'').trim().toLowerCase();
      const NUM   = ['programa','proceso','bodega','saldo','corte_u','taller','texterno','limpiado','lavanderia','terminacion'];
      let vis = 0;
      const tots = {};
      NUM.forEach(k => tots[k] = 0);
      allRows().forEach(row => {
        const show =
          (etapa === 'todo' || row.dataset.etapa === etapa) &&
          (temp  === 'todo' || row.dataset.temp  === temp) &&
          (tipo  === 'todo' || row.dataset.tipo?.startsWith(tipo)) &&
          (!art || row.dataset.art.includes(art)) &&
          (!oc  || row.dataset.oc.includes(oc));
        row.style.display = show ? '' : 'none';
        if (show) { vis++; NUM.forEach(k => tots[k] += parseInt(row.dataset[k])||0); }
      });
      const countEl = document.getElementById('tblCount');
      if (countEl) countEl.textContent = `${vis} de ${allRows().length} OC`;
      NUM.forEach(k => { const el = document.getElementById(`tblTotal_${k}`); if (el) el.textContent = fmt(tots[k]); });
    }
    document.getElementById('tblEtapa')?.addEventListener('change', applyTablaFilters);
    document.getElementById('tblArtSearch')?.addEventListener('input', applyTablaFilters);
    document.getElementById('tblOcSearch')?.addEventListener('input', applyTablaFilters);
    document.querySelectorAll('#tblTempSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#tblTempSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyTablaFilters();
    }));
    document.querySelectorAll('#tblTipoSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#tblTipoSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyTablaFilters();
    }));

    // Sortable headers
    let _tblSortCol = 'fecha', _tblSortDir = 'desc';
    function applyTablaSort(col) {
      const isNum = !!document.querySelector(`#tablaHead th[data-col="${col}"]`)?.dataset.num;
      if (_tblSortCol === col) _tblSortDir = _tblSortDir === 'asc' ? 'desc' : 'asc';
      else { _tblSortCol = col; _tblSortDir = isNum ? 'desc' : 'asc'; }
      document.querySelectorAll('#tablaHead th.th-sort').forEach(th => {
        th.querySelector('.sort-ic').textContent = '';
      });
      const activeTh = document.querySelector(`#tablaHead th[data-col="${col}"]`);
      if (activeTh) activeTh.querySelector('.sort-ic').textContent = _tblSortDir === 'asc' ? '↑' : '↓';
      const tbody = document.getElementById('tablaBody');
      if (!tbody) return;
      const trs = Array.from(tbody.querySelectorAll('tr[data-art]'));
      trs.sort((a, b) => {
        let av = a.getAttribute('data-' + col) || '';
        let bv = b.getAttribute('data-' + col) || '';
        if (isNum) { av = parseFloat(av)||0; bv = parseFloat(bv)||0; }
        if (av < bv) return _tblSortDir === 'asc' ? -1 : 1;
        if (av > bv) return _tblSortDir === 'asc' ? 1 : -1;
        return 0;
      });
      trs.forEach(tr => tbody.appendChild(tr));
      applyTablaFilters();
    }
    document.querySelectorAll('#tablaHead th.th-sort').forEach(th => {
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      th.onclick = () => applyTablaSort(th.dataset.col);
    });
  }

  // Stock Bodega — filters
  if (secId === 'stock') {
    const SUC_NAMES_BIND = {
      '00':'Bod. S.Filomena','01':'Stock Perú','02':'Loc. Perú','04':'San Gerardo',
      '05':'Codegua','10':'Showroom','12':'Outlet S.Fil.','33':'Urrutia',
      '34':'Telas','35':'Insumos'
    };
    function applyStockFilters() {
      const suc  = document.querySelector('#stSucSegs .seg.on')?.dataset.suc  || 'all';
      const temp = document.querySelector('#stTempSegs .seg.on')?.dataset.t   || 'all';
      const bota = document.querySelector('#stBotaSegs .seg.on')?.dataset.bota || 'all';
      let vis = 0, totalU = 0;
      document.querySelectorAll('#stockBody tr.st-row').forEach(row => {
        const tempOk = temp === 'all' || row.dataset.temp === temp;
        const botaOk = bota === 'all' || row.dataset.bota === bota;
        const qty = suc === 'all'
          ? parseInt(row.dataset.prendas)||0
          : parseInt(row.dataset[`s${suc}`])||0;
        const show = tempOk && botaOk && qty > 0;
        row.style.display = show ? '' : 'none';
        const qtyCell = row.querySelector('td:last-child');
        if (qtyCell) qtyCell.textContent = show ? fmt(qty) : '';
        if (show) { vis++; totalU += qty; }
      });
      const el = id => document.getElementById(id);
      const sucName = suc === 'all' ? 'Local' : (SUC_NAMES_BIND[suc] || suc);
      if (el('stCount'))     el('stCount').textContent     = `${vis} artículos`;
      if (el('stTotalUnid')) el('stTotalUnid').textContent = fmt(totalU);
      if (el('stTotalArt'))  el('stTotalArt').textContent  = fmt(vis);
      if (el('stPromedio'))  el('stPromedio').textContent  = Math.round(totalU/Math.max(1,vis));
      if (el('stUnidLbl'))   el('stUnidLbl').textContent   = `Prendas en ${sucName}`;
    }
    document.querySelectorAll('#stSucSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#stSucSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyStockFilters();
    }));
    document.querySelectorAll('#stTempSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#stTempSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyStockFilters();
    }));
    document.querySelectorAll('#stBotaSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#stBotaSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyStockFilters();
    }));
    applyStockFilters();
  }

  // Venta vs Despacho — filters
  if (secId === 'venta-despacho') {

      const av  = document.querySelector('#vdAvanceSegs .seg.on')?.dataset.av || 'todo';

        const pct = parseInt(row.dataset.avance)||0;
        const avOk = av === 'todo' ||
          (av === 'cero'     && pct === 0) ||
          (av === 'parcial'  && pct > 0 && pct < 100) ||
          (av === 'completo' && pct >= 100);
        const qOk = !q || row.dataset.nombre.includes(q) || row.dataset.ciudad.includes(q);
        row.style.display = (avOk && qOk) ? '' : 'none';
        if (avOk && qOk) vis++;
      });
      const el = document.getElementById('vdCount');
      if (el) el.textContent = `${vis} clientes`;
    }
    document.getElementById('vdSearch')?.addEventListener('input', applyVDFilters);
    document.querySelectorAll('#vdAvanceSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#vdAvanceSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); applyVDFilters();
    }));
  }

  // Clientes Inactivos — filters
  if (secId === 'clientes') {
    let cutoff = 180;
    function applyClFilters() {
      const q = (document.getElementById('clSearch')?.value||'').trim().toLowerCase();
      let vis = 0, totalVal = 0, totalDias = 0;
      document.querySelectorAll('#clBody tr[data-nombre]').forEach(row => {
        const dias = parseInt(row.dataset.dias)||0;
        const show = dias > cutoff &&
          (!q || row.dataset.nombre.includes(q) || row.dataset.ciudad.includes(q));
        row.style.display = show ? '' : 'none';
        if (show) { vis++; totalDias += dias; }
      });
      const el = id => document.getElementById(id);
      if (el('clCount'))  el('clCount').textContent  = `${vis} clientes`;
      if (el('clKCount')) el('clKCount').textContent = vis;
      if (el('clKDias'))  el('clKDias').textContent  = vis ? Math.round(totalDias/vis) : 0;
      if (el('clTblTtl')) el('clTblTtl').textContent = `Clientes con Saldo Pendiente +${cutoff} días`;
      if (el('clKLbl'))   el('clKLbl').textContent   = `Clientes con saldo +${cutoff}d`;
    }
    document.getElementById('clSearch')?.addEventListener('input', applyClFilters);
    document.querySelectorAll('#clDiasSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#clDiasSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      cutoff = parseInt(b.dataset.d)||0;
      applyClFilters();
    }));
    applyClFilters(); // apply 180d default
  }

  // Pedido vs Corte — temp switcher
  if (secId === 'pvc') {
    function applyPvcFilter() {
      const estado = document.querySelector('#pvcEstadoSegs .seg.on')?.dataset.estado || 'all';
      const etapa  = document.querySelector('#pvcEtapaSegs .seg.on')?.dataset.etapa  || 'all';
      const rows = document.querySelectorAll('#pvcBody tr[data-expandable]');
      let visible = 0, sumPed = 0, sumCort = 0;
      rows.forEach(row => {
        const showEstado = estado === 'all' || row.dataset.estado === estado;
        const showEtapa  = etapa  === 'all' || row.dataset.etapa  === etapa;
        const show = showEstado && showEtapa;
        row.style.display = show ? '' : 'none';
        let next = row.nextElementSibling;
        while (next && next.classList.contains('variant-row')) {
          next.style.display = 'none';
          next = next.nextElementSibling;
        }
        if (show) {
          visible++;
          sumPed  += parseInt(row.dataset.ped  || 0);
          sumCort += parseInt(row.dataset.cort || 0);
        }
      });
      // Actualizar KPIs con los totales filtrados
      const diff = sumCort - sumPed;
      const kpedEl  = document.getElementById('pvcKPed');
      const kprogEl = document.getElementById('pvcKProg');
      const kdiffEl = document.getElementById('pvcKDiff');
      if (kpedEl)  kpedEl.textContent  = fmt(sumPed);
      if (kprogEl) kprogEl.textContent = fmt(sumCort);
      if (kdiffEl) { kdiffEl.textContent = (diff>0?'+':'')+fmt(diff); kdiffEl.style.color = diff>=0?'var(--ok)':'var(--er)'; }
      const t = document.querySelector('#pvcSegs .seg.on')?.dataset.t || '44';
      const foot = document.getElementById('pvcFoot');
      if (foot) foot.textContent = `${visible} modelos T${t}`;
    }

    document.querySelectorAll('#pvcEstadoSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#pvcEstadoSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      applyPvcFilter();
    }));

    document.querySelectorAll('#pvcEtapaSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#pvcEtapaSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      applyPvcFilter();
    }));

    document.querySelectorAll('#pvcSegs .seg').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#pvcSegs .seg').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const t = b.dataset.t;
      const ftMap = buildFtMap(CACHE['full_table.json'] || []);
      const byTemp = buildByTemp();
      // Update KPIs
      const items = byTemp[t]?.items || [];
      let totalPed = 0, totalProg = 0;
      for (const item of items) {
        const suffix = item.base.slice(-2);
        totalPed += item.total;
        for (const v of (item.modelos||[])) {
          const art = `01${t}${suffix}${v.mod.padStart(2,'0')}`;
          totalProg += ftMap[art]?.corte || 0;
        }
      }
      const diff = totalProg - totalPed;
      const kpedEl = document.getElementById('pvcKPed');
      const kprogEl = document.getElementById('pvcKProg');
      const kdiffEl = document.getElementById('pvcKDiff');
      if (kpedEl) kpedEl.textContent = fmt(totalPed);
      if (kprogEl) kprogEl.textContent = fmt(totalProg);
      if (kdiffEl) { kdiffEl.textContent = (diff>0?'+':'')+fmt(diff); kdiffEl.style.color = diff>=0?'var(--ok)':'var(--er)'; }
      const exMap2 = CACHE['pvc_ex.json'] || {};
      document.getElementById('pvcBody').innerHTML = buildPVCRows(t, ftMap, exMap2);
      // Reset filters when switching temp
      document.querySelectorAll('#pvcEstadoSegs .seg').forEach(x => x.classList.remove('on'));
      const allBtn = document.querySelector('#pvcEstadoSegs .seg[data-estado="all"]');
      if (allBtn) allBtn.classList.add('on');
      document.querySelectorAll('#pvcEtapaSegs .seg').forEach(x => x.classList.remove('on'));
      const allEtapaBtn = document.querySelector('#pvcEtapaSegs .seg[data-etapa="all"]');
      if (allEtapaBtn) allEtapaBtn.classList.add('on');
      bindExpandRows();
      applyPvcFilter();
    }));
    bindExpandRows();
    applyPvcFilter();
  }

  // Reporte Venta section
  if (secId === 'reporte-venta') {
    function applyVentaFilter(filtered, label) {
      const neto = filtered.reduce((s,d) => s+d.neto, 0);
      const bruto = filtered.reduce((s,d) => s+d.bruto, 0);
      const prendas = filtered.reduce((s,d) => s+d.prendas, 0);
      document.getElementById('vkDocsVal').textContent = filtered.length;
      document.getElementById('vkPrendasVal').textContent = fmt(prendas);
      document.getElementById('vkNetoVal').textContent = fmtM(neto);
      document.getElementById('vkBrutoVal').textContent = fmtM(bruto);
      document.getElementById('vTblTtl').textContent = label;
      document.getElementById('ventaBody').innerHTML = buildVentaTable(filtered.slice(0,200));
      document.getElementById('ventaFoot').textContent = `${filtered.length} documentos · ${fmtCLP(neto)} neto`;
    }

    document.querySelectorAll('#ventaSegs .seg').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#ventaSegs .seg').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const fechaInput = document.getElementById('ventaFecha');
        if (fechaInput) fechaInput.value = '';
        const p = btn.dataset.vp;
        const hoy = today();
        let filtered, label;
        if (p === 'hoy') {
          const hoyData = getHoyDocs();
          filtered = hoyData.docs;
          label = hoyData.label;
        } else if (p === 'semana') {
          const lunes = new Date(); lunes.setDate(lunes.getDate() - lunes.getDay() + 1);
          const lunesStr = lunes.toISOString().split('T')[0];
          filtered = DOCS.filter(d => d.fecha_iso >= lunesStr && d.fecha_iso <= hoy);
          label = 'Documentos de Esta Semana';
        } else if (p === 'mes') {
          const mesStr = hoy.slice(0,7);
          filtered = DOCS.filter(d => d.fecha_iso?.startsWith(mesStr));
          label = 'Documentos de Este Mes';
        } else {
          filtered = DOCS;
          label = 'Todos los Documentos 2026';
        }
        applyVentaFilter(filtered, label);
      });
    });

    document.getElementById('ventaFecha')?.addEventListener('change', function() {
      const fecha = this.value; // YYYY-MM-DD
      if (!fecha) return;
      document.querySelectorAll('#ventaSegs .seg').forEach(b => b.classList.remove('on'));
      const filtered = DOCS.filter(d => d.fecha_iso === fecha);
      const [y, m, d] = fecha.split('-');
      const label = `Documentos del ${d}/${m}/${y}`;
      applyVentaFilter(filtered, label);
    });
  }
}

function buildColorRowsForTemp(byTemp, t) {
  const info = byTemp[t];
  if (!info?.items?.length) return '<tr class="no-click"><td colspan="4" style="text-align:center;padding:20px;color:var(--tx3)">Sin datos</td></tr>';
  const tc = tcFor(t);
  return info.items.slice().sort((a,b) => b.total-a.total).map(item => {
    const variantRows = (item.modelos || []).map(v =>
      `<tr class="no-click variant-row" style="display:none;background:var(--sf2)">
        <td></td>
        <td class="td-dim" style="padding-left:28px">└ color ${v.mod}</td>
        <td class="r td-num td-dim">${fmt(v.qty)}</td>
        <td class="r td-dim">—</td>
      </tr>`
    ).join('');
    return `<tr data-expandable style="font-weight:600">
      <td><span class="badge ${tc.cls}">T${t}</span> <span class="td-code" style="margin-left:6px">${item.base}</span></td>
      <td class="td-dim" style="font-weight:400">${item.colores} color${item.colores>1?'es':''}</td>
      <td class="r td-num">${fmt(item.total)}</td>
      <td class="r td-dim">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="expand-icon" style="transition:transform .15s;display:inline-block;vertical-align:middle"><polyline points="6 9 12 15 18 9"/></svg>
      </td>
    </tr>${variantRows}`;
  }).join('');
}

function bindExpandRows() {
  document.querySelectorAll('[data-expandable]').forEach(row => {
    row.style.cursor = 'pointer';
    row.onclick = () => {
      let next = row.nextElementSibling;
      // Determinar si las filas están abiertas revisando la primera variant-row
      const isOpen = next && next.classList.contains('variant-row') && next.style.display !== 'none';
      const icon = row.querySelector('.expand-icon');
      if (icon) icon.style.transform = isOpen ? '' : 'rotate(-180deg)';
      while (next && next.classList.contains('variant-row')) {
        next.style.display = isOpen ? 'none' : '';
        next = next.nextElementSibling;
      }
    };
  });
}

/* ── MOBILE SIDEBAR ─────────────────────────────────────────── */
function bindMobile() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const close = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };
  document.getElementById('hamburger').addEventListener('click', () => {
    sidebar.classList.add('open'); overlay.classList.add('open');
  });
  overlay.addEventListener('click', close);
  document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', close));
}

/* ── INIT ────────────────────────────────────────────────────── */
async function init() {
  // Cargar datos base en paralelo + meta para timestamp real del build
  const [pa, dv, meta] = await Promise.all([
    load('pedidos_art.json'),
    load('docs_venta.json'),
    load('meta.json').catch(() => null),
  ]);
  PEDS_ART = pa; DOCS = dv;
  const tsEl = document.getElementById('hdTs');
  tsEl.textContent = meta?.updated_str ? `Datos: ${meta.updated_str}` : '—';
  tsEl.title = meta?.updated_str ? 'Última actualización desde Z:\\BI' : '';

  // Venta hoy
  const hoy = today();
  const hoyDocs = DOCS.filter(d => d.fecha_iso === hoy);
  if (hoyDocs.length) {
    VENTA_HOY = { neto: hoyDocs.reduce((s,d)=>s+d.neto,0), prendas: hoyDocs.reduce((s,d)=>s+d.prendas,0), count: hoyDocs.length, label:'Hoy' };
  } else {
    const fechas = [...new Set(DOCS.map(d=>d.fecha_iso).filter(Boolean))].sort();
    const last = fechas[fechas.length-1];
    if (last) {
      const ld = DOCS.filter(d=>d.fecha_iso===last);
      const [y,m,d] = last.split('-');
      VENTA_HOY = { neto: ld.reduce((s,d)=>s+d.neto,0), prendas: ld.reduce((s,d)=>s+d.prendas,0), count: ld.length, label:`${d}/${m}` };
    }
  }

  await go('resumen', 'Resumen General');

  document.querySelectorAll('.nav-item[data-sec]').forEach(btn => {
    btn.addEventListener('click', () => go(btn.dataset.sec, btn.dataset.ttl));
  });

  bindMobile();
}

document.addEventListener('DOMContentLoaded', init);
</script>
